# Bei jedem Push auf main: testen, zum Hoster schieben, neu starten.
#
# Laeuft nur an, wenn sich am Bot wirklich etwas geaendert hat - Aenderungen
# am Dashboard gehen ueber Vercel und muessen den Bot nicht durchstarten.

name: Bot ausliefern

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bot-ausliefern.yml'
      - '.github/scripts/push-to-host.mjs'
  workflow_dispatch:

# Zwei Auslieferungen gleichzeitig wuerden sich beim Schreiben in die Quere
# kommen. Die aeltere wird abgebrochen, die neuere gewinnt.
concurrency:
  group: bot-ausliefern
  cancel-in-progress: true

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      # Erst pruefen, dann ausliefern. Ein kaputter Bot soll gar nicht erst
      # auf den Server kommen.
      - run: npm test

      - name: Zum Hoster schieben und neu starten
        env:
          BOTHOST_API_KEY: ${{ secrets.BOTHOST_API_KEY }}
          BOTHOST_DEPLOYMENT: ${{ secrets.BOTHOST_DEPLOYMENT }}
        run: node .github/scripts/push-to-host.mjs
